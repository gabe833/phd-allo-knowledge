name: Test RentSmart Access

on:
  workflow_dispatch:

jobs:
  test-rentsmart:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test RentSmart HTML
        run: node scripts/test-rentsmart.mjs
