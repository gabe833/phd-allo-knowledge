name: Update PHD Rental Knowledge

on:
  workflow_dispatch:

  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          
      - name: Install HTML parser
        run: npm install --no-save cheerio@1
        
      - name: Scrape current RentSmart listings
        run: node scripts/scrape-rentals.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload rental knowledge page
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
