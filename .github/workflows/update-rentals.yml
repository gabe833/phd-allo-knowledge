name: Update PHD Rental Knowledge

on:
  workflow_dispatch:

  schedule:
    # Run every hour.
    # GitHub schedules use UTC.
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Scrape current RentSmart listings
        run: node scripts/scrape-rentals.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload rental knowledge page
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload debug files if scraping fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rentsmart-debug
          path: ./debug
          if-no-files-found: ignore
